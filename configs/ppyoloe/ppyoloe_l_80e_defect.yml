_BASE_: [
#  '../datasets/defect.yml',
  '../runtime.yml',
  './_base_/optimizer_80e.yml',
  './_base_/ppyoloe_plus_crn.yml',
  './_base_/ppyoloe_plus_reader.yml',
]
metric: COCO
num_classes: 7

TrainDataset:
  name: COCODataSet
  image_dir: train
  anno_path: train\_annotations.coco.json
  dataset_dir: E:\data\DefectDet
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']

EvalDataset:
  name: COCODataSet
  image_dir: valid
  anno_path: valid\_annotations.coco.json
  dataset_dir: E:\data\DefectDet
  allow_empty: true

TestDataset:
  name: ImageFolder
  anno_path: valid\_annotations.coco.json # also support txt (like VOC's label_list.txt)
  dataset_dir: E:\Huilin\2308_concretespalling\data\merge_data\ # if set, anno_path will be 'dataset_dir/anno_path'

epoch: 100
log_iter: 100
snapshot_epoch: 5
weights: E:\Huilin\2308_concretespalling\code\output\ppyoloe_plus_l_defect_constrast\best_model.pdparams

pretrain_weights: https://bj.bcebos.com/v1/paddledet/models/pretrained/ppyoloe_crn_l_obj365_pretrained.pdparams
depth_mult: 1.0
width_mult: 1.0


LearningRate:
  base_lr: 0.0001
  schedulers:
    - !CosineDecay
      max_epochs: 96
    - !LinearWarmup
      start_factor: 0.
      epochs: 5

YOLOv3:
  backbone: CSPResNet
  neck: CustomCSPPAN
  yolo_head: PPYOLOEContrastHead
  post_process: ~

PPYOLOEContrastHead:
  fpn_strides: [32, 16, 8]
  grid_cell_scale: 5.0
  grid_cell_offset: 0.5
  static_assigner_epoch: 100
  use_varifocal_loss: True
  loss_weight: {class: 1.0, iou: 2.5, dfl: 0.5, contrast: 0.2}
  static_assigner:
    name: ATSSAssigner
    topk: 9
  assigner:
    name: TaskAlignedAssigner
    topk: 13
    alpha: 1.0
    beta: 6.0
  contrast_loss:
    name: SupContrast
    temperature: 100
    sample_num: 2048
    thresh: 0.75
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 300
    score_threshold: 0.01
    nms_threshold: 0.7


TrainReader:
  batch_size: 6
EvalReader:
  batch_size: 6
